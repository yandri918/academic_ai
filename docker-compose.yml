version: "3.8"

# ============================================
# AcademAI — Local Support Services
# ============================================
# n8n (AI Workflow)  → Railway cloud  (lihat railway.toml)
# Gotenberg          → localhost:3001  (PDF converter)
# Frontend (Nginx)   → localhost:8080  (Web UI)
# ============================================

services:

  # ── Gotenberg: PDF Converter ──────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: academ-ai-gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--api-timeout=60s"
    networks:
      - academ-net

  # ── Frontend: Nginx Static Server ────────────
  frontend:
    image: nginx:alpine
    container_name: academ-ai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - academ-net

networks:
  academ-net:
    driver: bridge

